name: Sync weekly stable package composition

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tradejs-project-package-update
  cancel-in-progress: false

jobs:
  update:
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Resolve all stable TradeJS package tags
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const previousDependencies = { ...packageJson.dependencies };
          const packageNames = Object.keys(packageJson.dependencies)
            .filter((name) => name.startsWith('@tradejs/'))
            .sort();
          const resolved = await Promise.all(
            packageNames.map(async (name) => {
              const response = await fetch(
                `https://registry.npmjs.org/${encodeURIComponent(name)}/latest`,
                { headers: { accept: 'application/json' } },
              );
              if (!response.ok) {
                throw new Error(`${name}: npm returned ${response.status}`);
              }
              const version = String((await response.json()).version ?? '');
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(`${name}@latest is not a stable exact version: ${version}`);
              }
              return { name, version };
            }),
          );
          for (const { name, version } of resolved) {
            packageJson.dependencies[name] = version;
          }
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          const changedPackages = resolved
            .filter(({ name, version }) => previousDependencies[name] !== version)
            .map(({ name }) => name);
          fs.writeFileSync(
            '.changed-tradejs-packages',
            `${changedPackages.join('\n')}${changedPackages.length ? '\n' : ''}`,
          );
          console.log(resolved.map(({ name, version }) => `${name}@${version}`).join('\n'));
          NODE
          mapfile -t changed_packages < .changed-tradejs-packages
          if [ "${#changed_packages[@]}" -gt 0 ]; then
            node ./scripts/bump-runtime-strategy-versions.mjs "${changed_packages[@]}"
          fi
          rm .changed-tradejs-packages
          yarn install --no-immutable
      - name: Detect composition change
        id: change
        run: |
          if git diff --quiet -- package.json yarn.lock tradejs.config.ts config/runtime; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create one local stable composition commit
        if: steps.change.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock tradejs.config.ts config/runtime
          git commit -m 'Sync weekly stable TradeJS packages [skip ci]'
      - name: Verify one stable production composition
        if: steps.change.outputs.changed == 'true'
        run: yarn checks
      - name: Build and smoke one stable production image
        if: steps.change.outputs.changed == 'true'
        run: |
          project_sha="$(git rev-parse HEAD)"
          node_version="$(node -p "require('./package.json').dependencies['@tradejs/node']")"
          docker build \
            --build-arg "TRADEJS_PROJECT_SHA=$project_sha" \
            -t "tradejs-project-weekly:$GITHUB_SHA" .
          bash ./scripts/beta-runtime-smoke.sh \
            "tradejs-project-weekly:$GITHUB_SHA" '@tradejs/node' \
            "$node_version" "$project_sha"
      - name: Push the verified stable composition
        if: steps.change.outputs.changed == 'true'
        run: |
          git fetch origin main
          [ "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" ] || {
            echo 'main advanced during weekly package verification' >&2
            exit 1
          }
          git push origin HEAD:main
      - name: Publish the updated Project image once
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
