name: Sync verified beta package composition

on:
  schedule:
    - cron: "47 * * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      framework_version:
        description: Exact framework beta; empty selects the current beta tag
        required: false
        type: string
      sync_stable_packages:
        description: Also refresh stable Base, Kit, and strategy packages
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: tradejs-project-package-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Resolve one verified beta framework cohort
        env:
          TRADEJS_FRAMEWORK_VERSION: ${{ inputs.framework_version || '' }}
          TRADEJS_SYNC_STABLE_PACKAGES: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || inputs.sync_stable_packages || false }}
        run: node ./scripts/sync-runtime-package-composition.mjs
      - name: Detect composition change
        id: change
        run: |
          if git diff --quiet -- package.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install the exact package composition
        if: steps.change.outputs.changed == 'true'
        run: yarn install --no-immutable
      - name: Create one local beta composition commit
        if: steps.change.outputs.changed == 'true'
        run: |
          framework_version="$(node -p "require('./package.json').dependencies['@tradejs/node']")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          git commit -m "Sync verified TradeJS beta ${framework_version} [skip ci]"
      - name: Verify one exact production composition
        if: steps.change.outputs.changed == 'true'
        run: yarn checks
      - name: Build and smoke one exact production image
        if: steps.change.outputs.changed == 'true'
        run: |
          project_sha="$(git rev-parse HEAD)"
          framework_version="$(node -p "require('./package.json').dependencies['@tradejs/node']")"
          docker build \
            --build-arg "TRADEJS_PROJECT_SHA=$project_sha" \
            -t "tradejs-project-beta:$GITHUB_RUN_ID" .
          bash ./scripts/project-image-smoke.sh \
            "tradejs-project-beta:$GITHUB_RUN_ID" '@tradejs/node' \
            "$framework_version" "$project_sha"
      - name: Push the verified beta composition
        if: steps.change.outputs.changed == 'true'
        run: |
          git fetch origin main
          [ "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" ] || {
            echo 'main advanced during beta package verification' >&2
            exit 1
          }
          git push origin HEAD:main
      - name: Publish the updated Project image once
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
