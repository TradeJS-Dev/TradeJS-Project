name: Publish project runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-project-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install immutable dependencies
        run: yarn install --immutable
      - name: Verify project
        run: yarn checks

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_REPOSITORY_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate immutable Deploy handoff credentials
        run: |
          node <<'NODE'
          if (!String(process.env.DEPLOY_REPOSITORY_TOKEN || '').trim()) {
            throw new Error('DEPLOY_REPOSITORY_TOKEN is required');
          }
          NODE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish project image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-project-app:${{ github.sha }}
          build-args: |
            TRADEJS_PROJECT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=project-app
          cache-to: type=gha,mode=max,scope=project-app,ignore-error=true
      - name: Dispatch immutable release to TradeJS-Deploy
        env:
          PROJECT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const token = String(process.env.DEPLOY_REPOSITORY_TOKEN || '').trim();
          if (!token) throw new Error('DEPLOY_REPOSITORY_TOKEN is empty');
          const response = await fetch(
            'https://api.github.com/repos/TradeJS-Dev/TradeJS-Deploy/dispatches',
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({
                event_type: 'tradejs-project-image-published',
                client_payload: {
                  project_sha: process.env.PROJECT_SHA,
                },
              }),
            },
          );
          const responseBody = await response.text();
          if (!response.ok) {
            throw new Error(
              `Deploy dispatch failed (${response.status}): ${responseBody}`,
            );
          }
          NODE
