name: Publish project runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-project-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Install immutable dependencies
        run: yarn install --immutable
      - name: Verify project
        run: yarn checks

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_REPOSITORY_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish project image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/tradejs-dev/tradejs-project-app:${{ github.sha }}
          build-args: |
            TRADEJS_PROJECT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=project-app
          cache-to: type=gha,mode=max,scope=project-app,ignore-error=true
      - name: Dispatch immutable release to TradeJS-Deploy
        if: env.DEPLOY_REPOSITORY_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          PROJECT_SHA: ${{ github.sha }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({event_type:"tradejs-project-image-published",client_payload:{image_tag:process.env.IMAGE_TAG,project_sha:process.env.PROJECT_SHA,app_changed:true,agent_changed:false,ml_infer_changed:false}}))' |
            gh api --method POST repos/TradeJS-Dev/TradeJS-Deploy/dispatches --input -
      - name: Report disabled deploy dispatch
        if: env.DEPLOY_REPOSITORY_TOKEN == ''
        run: echo "::notice::Create the DEPLOY_REPOSITORY_TOKEN secret to enable TradeJS-Deploy dispatches."
